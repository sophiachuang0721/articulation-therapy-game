$("tr").textContent=`💰 累積寶藏：${coins}`;$("game").classList.add("hide");$("end").classList.remove("hide");
$("end").innerHTML=`<div class="big">🏝️ 抵達寶島！</div><p>🎁 獲得 ${c} 個寶藏</p><p style="font-size:24px">${rankT()}</p><textarea id="rp" readonly>${t}</textarea><div class="row"><button class="b" id="cp">📋 複製紀錄</button><button class="b y" id="again">🔁 再玩一次</button><button class="b" id="mn">🏠 回選單</button></div>`;
$("cp").onclick=async()=>{try{await navigator.clipboard.writeText(t);toast("已複製")}catch(e){$("rp").select();toast("請手動複製選取的文字")}};$("again").onclick=$("start").onclick;$("mn").onclick=menu}
$("bk").onclick=()=>{if(trial>0&&C.mode!="l"){LG.pop();trial--;bar();card()}else if(qi>0){qi--;LG.length=TS[qi];turn()}else toast("已經是第一題")};
let hmT=0;$("hm").onclick=()=>{if(hmT){clearTimeout(hmT);hmT=0;$("hm").textContent="🏠 回選單";menu()}else{$("hm").textContent="再按一次確認離開（本局紀錄不保存）";hmT=setTimeout(()=>{hmT=0;$("hm").textContent="🏠 回選單"},3500)}};
function menu(){["end","hv","game"].forEach(i=>$(i).classList.add("hide"));$("menu").classList.remove("hide")}
$("hist").onclick=()=>{$("menu").classList.add("hide");$("hv").classList.remove("hide");$("hv").innerHTML=`<h3>📚 歷史紀錄（這支瀏覽器，最近 30 次）</h3>${hist.map(h=>`<div class="pc"><pre style="white-space:pre-wrap;margin:0;font:inherit">${h}</pre></div>`).join("")||"<p>還沒有紀錄</p>"}<div class="row"><button class="b" id="hb">← 回選單</button><button class="b n" id="hc">清除全部</button></div>`;
$("hb").onclick=menu;$("hc").onclick=()=>{if($("hc").dataset.s){hist=[];try{localStorage.setItem("trh2","[]")}catch(e){}$("hist").onclick()}else{$("hc").dataset.s=1;$("hc").textContent="再按一次確認清除"}}};
</script></body></html>
